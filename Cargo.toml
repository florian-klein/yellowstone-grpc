[workspace]
resolver = "2"
members = [
    "examples/rust", # 12.1.0
    "yellowstone-grpc-client", # 12.1.0
    "yellowstone-grpc-geyser", # 12.1.0
    "yellowstone-grpc-proto", # 12.1.0
]
exclude = [
    "yellowstone-grpc-client-nodejs/napi", # 0.2.0
]

[workspace.package]
authors = ["Triton One"]
edition = "2021"
homepage = "https://triton.one"
repository = "https://github.com/rpcpool/yellowstone-grpc"
license = "AGPL-3.0"
keywords = ["solana"]
publish = false

[workspace.dependencies]
affinity = "0.1.2"
anyhow = "1.0.102"
backoff = "0.4.0"
base64 = "0.22.1"
bincode = "1.3.3"
bs58 = "0.5.1"
bytes = "1.11.1"
bytesize = "2.3.1"
cargo-lock = "11.0.1"
chrono = "0.4.44"
clap = "4.5.60"
criterion = "0.8.2"
crossbeam-channel = "0.5.15"
env_logger = "0.11.9"
futures = "0.3.32"
git-version = "0.3.9"
hex = "0.4.3"
hostname = "0.4.2"
http = "1.4.0"
http-body-util = "0.1.3"
humantime-serde = "1.1.1"
hyper = "1.8.1"
hyper-util = "0.1.20"
indicatif = "0.18.4"
lazy_static = "1.5.0"
local-ip-address = "0.6.10"
log = "0.4.29"
maplit = "1.0.2"
prometheus = "0.14.0"
pin-project = "1.1.11"
prost = "0.14.3"
prost-types = "0.14.3"
prost_011 = { package = "prost", version = "0.11.9" }
protoc-bin-vendored = "3.2.0"
rayon = "1.11.0"
serde = "1.0.228"
serde_json = "1.0.149"
smallvec = "1.15.1"
thiserror = "2.0.18"
tokio = "1.50.0"
tokio-stream = "0.1.18"
tokio-util = "0.7.18"
tower = "0.4"
tower-layer = "0.3.3"
tonic = "0.14.5"
tonic-build = "0.14.5"
tonic-prost = "0.14.5"
tonic-prost-build = "0.14.5"
tonic-health = "0.14.5"
vergen = "9.1.0"

# Agave Monorepo (path deps to match local agave 4.1.0-alpha.0)
agave-geyser-plugin-interface = { path = "/home/solana/agave/geyser-plugin-interface" }
solana-account-decoder = { path = "/home/solana/agave/account-decoder", features = ["agave-unstable-api"] }
agave-logger = { path = "/home/solana/agave/logger", features = ["agave-unstable-api"] }
solana-storage-proto = { path = "/home/solana/agave/storage-proto", features = ["agave-unstable-api"] }
solana-transaction-context = { path = "/home/solana/agave/transaction-context", features = ["agave-unstable-api"] }
solana-transaction-status = { path = "/home/solana/agave/transaction-status" }

# Solana SDK (EXACT versions locked to agave 4.2.0-alpha.0's Cargo.lock).
# These crates' types (SanitizedTransaction, Message, TransactionError, Pubkey,
# Signature, AccountSharedData, Hash, Clock) cross the geyser plugin boundary by
# reference: the validator constructs them, the plugin reads them. `agave-unstable-api`
# gives no ABI stability, so a version skew here silently corrupts field offsets and
# SIGSEGVs in the notify path (e.g. Filter::get_updates). Pin `=` so a `cargo update`
# fails loudly instead of floating past agave. Keep in lockstep with agave's Cargo.lock.
solana-account = "=4.3.1"
solana-clock = "=3.1.1"
solana-hash = "=4.4.0"
solana-keypair = "3.1.2"
solana-message = "=4.2.3"
solana-pubkey = "=4.2.0"
solana-signature = "=3.4.1"
solana-signer = "3.0.0"
solana-transaction = "=4.1.4"
solana-transaction-error = "=3.3.0"

# Solana Misc
spl-token-2022-interface = "2.1.0"

# Yellowstone
yellowstone-grpc-client = { path = "yellowstone-grpc-client", version = "12.1.0" }
yellowstone-grpc-geyser = { path = "yellowstone-grpc-geyser", version = "12.1.0" }
yellowstone-grpc-proto = { path = "yellowstone-grpc-proto", version = "12.1.0", default-features = false }

[workspace.lints.clippy]
clone_on_ref_ptr = "deny"
missing_const_for_fn = "deny"
trivially_copy_pass_by_ref = "deny"

[profile.release]
lto = true
codegen-units = 1
